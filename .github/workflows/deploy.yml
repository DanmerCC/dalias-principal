name: deploy

on:
  push:
    branches: [francisco]
  workflow_dispatch:

concurrency:
  group: deploy-dalias-principal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, dalias-principal]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build # -> dist/dalias/browser

      - name: Publish build
        run: |
          mkdir -p /opt/dalias-principal/app
          rsync -a --delete dist/dalias/browser/ /opt/dalias-principal/app/

      - name: Sync Caddyfile + restart
        run: |
          cp Caddyfile /opt/dalias-principal/Caddyfile
          sudo systemctl restart dalias-principal

      - name: Health check
        run: |
          sleep 2
          curl -fsS -o /dev/null -w "principal %{http_code}\n" http://127.0.0.1:4002/
