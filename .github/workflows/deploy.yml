name: deploy

on:
  push:
    branches: [francisco]
  workflow_dispatch:

concurrency:
  group: deploy-dalias-principal
  cancel-in-progress: false

jobs:
  deploy:
    # Solo en el repo de la org: los forks no tienen runner y los runs quedan en cola.
    if: github.repository == 'Residencia-Las-Dalias/dalias-principal'
    runs-on: [self-hosted, linux, dalias-principal]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build # -> dist/dalias/{browser,server}

      - name: Publish build
        run: |
          mkdir -p /opt/dalias-landing/app
          rsync -a --delete dist/dalias/ /opt/dalias-landing/app/

      - name: Sync systemd unit + Caddyfile
        run: |
          sudo cp deploy/dalias-ssr.service /etc/systemd/system/dalias-ssr.service
          sudo systemctl daemon-reload
          cp Caddyfile /opt/dalias-landing/Caddyfile

      - name: Restart services
        run: |
          sudo systemctl restart dalias-ssr
          sudo systemctl restart dalias-landing

      - name: Health check
        run: |
          sleep 2
          # El SSR responde y el HTML trae contenido renderizado (no un cascarón).
          curl -fsS http://127.0.0.1:4101/ | grep -q "Nuestras Actividades"
          curl -fsS -o /dev/null -w "landing %{http_code}\n" http://127.0.0.1:4001/
          curl -fsS -o /dev/null -w "api %{http_code}\n" "http://127.0.0.1:4001/api/actividades?limit=1"
