<app-header *ngIf="mostrarLayout"></app-header>
<router-outlet></router-outlet>
<app-footer *ngIf="mostrarLayout"></app-footer>

<app-anuncio-popup *ngIf="mostrarLayout"></app-anuncio-popup>

<!-- Botón flotante scroll to top -->
<button
  *ngIf="mostrarLayout"
  (click)="scrollToTop()"
  class="float-button scroll-top-button"
  [class.show]="showScrollButton"
>
  <i class="fas fa-arrow-up"></i>
</button>

<!-- Botón flotante WhatsApp -->
<a
  *ngIf="mostrarLayout"
  [href]="whatsappLink"
  target="_blank"
  class="float-button whatsapp-button"
>
  <span class="whatsapp-button__onda" aria-hidden="true"></span>
  <i class="fab fa-whatsapp"></i>
</a>
